// SVG FULL-BODY ANIMAL RENDERER COMPONENT
function FullBodyAnimal({ pet, scale = 1, onClick }) {
  const palette = COLOR_PALETTES.find(p => p.id === pet.colorId) || COLOR_PALETTES[0];
  const pose = pet.pose || 'happy';
  const eq = pet.equipped || {};

  // Dialog and click reaction particles
  const [clickHearts, setClickHearts] = useState([]);
  const [currentQuote, setCurrentQuote] = useState(null);

  const handleAnimalClick = (e) => {
    // Generate floating hearts/emotes
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    const newHeart = { id: Date.now(), x, y };
    setClickHearts(prev => [...prev.slice(-4), newHeart]);

    // Random personality quote
    const quotes = PERSONALITIES[pet.personality]?.quotes || PERSONALITIES.alegre.quotes;
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    setCurrentQuote(q);

    if (onClick) onClick();
  };

  return (
    <div 
      onClick={handleAnimalClick}
      className="relative cursor-pointer select-none flex flex-col items-center justify-center group"
      style={{ width: 220 * scale, height: 260 * scale }}
    >
      {/* Dynamic Floating Speech Bubble */}
      {currentQuote && (
        <div className="absolute -top-12 z-30 bg-parchment-100 text-forest-900 border-2 border-forest-800 px-3 py-1.5 rounded-2xl text-xs font-bold font-fredoka shadow-lg max-w-[200px] text-center animate-bounce">

        </div>
      )}

      {/* Heart Particles on Click */}
      {clickHearts.map(h => (
        <span 
          key={h.id} 
          className="absolute z-40 text-xl pointer-events-none animate-float-up"
          style={{ left: h.x, top: h.y }}
        >
          💖
        </span>
      ))}

      {/* SVG Canvas for Full-Body Render */}
      <svg 
        width={200 * scale} 
        height={220 * scale} 
        viewBox="0 0 200 220" 
        className="overflow-visible animate-pet-bob"
      >
        <defs>
          <linearGradient id={`grad_body_${pet.colorId}`} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={palette.primary} />
            <stop offset="100%" stopColor={palette.secondary} />
          </linearGradient>

          <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="2" floodColor="#0e241f" floodOpacity="0.35" />
          </filter>
        </defs>

        <g filter="url(#shadow3d)">
          {/* AURA EFFECTS */}
          {eq.aura === 'aura_stars' && (
            <g className="animate-aura">
              <circle cx="100" cy="110" r="85" fill="none" stroke="#E8A33D" strokeWidth="4" strokeDasharray="8 8" opacity="0.6" />

              <text x="160" y="160" fontSize="20">⭐</text>
            </g>
          )}
          {eq.aura === 'aura_fire' && (
            <g className="animate-aura">
              <circle cx="100" cy="115" r="80" fill="none" stroke="#E85D4C" strokeWidth="6" strokeDasharray="12 6" opacity="0.7" />
              <text x="15" y="110" fontSize="22">🔥</text>
              <text x="165" y="110" fontSize="22">🔥</text>
            </g>
          )}
          {eq.aura === 'aura_bubbles' && (
            <g className="animate-aura">
              <circle cx="25" cy="80" r="12" fill="#7FA37A" opacity="0.4" />
              <circle cx="170" cy="60" r="18" fill="#7FA37A" opacity="0.3" />
            </g>
          )}
          {eq.aura === 'aura_leaves' && (
            <g className="animate-aura">
              <text x="25" y="60" fontSize="18">🍃</text>
              <text x="160" y="140" fontSize="18">🌿</text>
            </g>
          )}

          {/* BACK BODY / TAIL SPECIFICS */}
          {pet.species === 'zorro' && (
            <path d="M140 120 Q185 100 170 160 Q130 180 120 150 Z" fill={palette.secondary} />
          )}
          {pet.species === 'dragon' && (
            <g fill={palette.secondary}>
              <path d="M50 110 Q20 80 40 140 Z" />
              <path d="M150 110 Q180 80 160 140 Z" />
              <path d="M130 140 Q170 170 140 180 Z" />
            </g>
          )}

          {/* CLOTHES: CAPE */}
          {eq.body === 'cape_hero' && (
            <path d="M60 90 L140 90 L155 185 L45 185 Z" fill="#E85D4C" />
          )}

          {/* LEGS & FEET */}
          <ellipse cx="75" cy="180" rx="16" ry="10" fill={palette.secondary} />
          <ellipse cx="125" cy="180" rx="16" ry="10" fill={palette.secondary} />

          {/* TORSO / BODY */}
          <path 
            d="M60 90 C50 140, 50 175, 75 180 C90 183, 110 183, 125 180 C150 175, 150 140, 140 90 Z" 
            fill={`url(#grad_body_${pet.colorId})`} 
          />

          {eq.body === 'vest_adventure' && (
            <path d="M62 95 L138 95 L135 150 L65 150 Z" fill="#E8A33D" rx="4" />
          )}
          {eq.body === 'scarf_cozy' && (

          )}
          {eq.body === 'plate_armor' && (
            <path d="M60 95 L140 95 L135 160 L65 160 Z" fill="#95a5a6" />
          )}

          {/* ARMS / PAWS */}
          <ellipse cx="55" cy="120" rx="12" ry="20" fill={palette.primary} transform="rotate(15 55 120)" />
          <ellipse cx="145" cy="120" rx="12" ry="20" fill={palette.primary} transform="rotate(-15 145 120)" />

          {/* HEAD BASE */}
          <circle cx="100" cy="70" r="42" fill={`url(#grad_body_${pet.colorId})`} />

          {/* SPECIES HEAD FEATURES */}
          {pet.species === 'zorro' && (

              <polygon points="65,40 50,5 80,30" />
              <polygon points="135,40 150,5 120,30" />
            </g>
          )}
          {pet.species === 'gatito' && (
            <g fill={palette.secondary}>
              <polygon points="68,40 58,15 82,32" />
              <polygon points="132,40 142,15 118,32" />

          )}
          {pet.species === 'buho' && (

              <circle cx="85" cy="66" r="6" />
              <circle cx="115" cy="66" r="6" />
              <circle cx="87" cy="64" r="2.5" fill="#fff" />
              <circle cx="117" cy="64" r="2.5" fill="#fff" />
            </g>
          )}

          {/* NOSE & MOUTH */}
          <polygon points="96,75 104,75 100,80" fill="#2c3e50" />
          <path d="M 95 82 Q 100 87 105 82" fill="none" stroke="#2c3e50" strokeWidth="2.5" strokeLinecap="round" />

          {/* CHEEKS */}
          <circle cx="74" cy="76" r="7" fill="#E85D4C" opacity="0.35" />
          <circle cx="126" cy="76" r="7" fill="#E85D4C" opacity="0.35" />

          {/* HEAD EQUIPMENT */}

          )}
          {eq.hand === 'open_book' && (

          {/* PET COMPANION */}
          {eq.pet && (
            <g transform="translate(10, 130)">
              {eq.pet === 'pet_butterfly' && <text x="0" y="0" fontSize="26" className="animate-bounce">🦋</text>}
              {eq.pet === 'pet_bird' && <text x="0" y="0" fontSize="26" className="animate-bounce">🐦</text>}
              {eq.pet === 'pet_firefly' && <text x="0" y="0" fontSize="26" className="animate-bounce">💡</text>}

          )}
        </g>
      </svg>
    </div>
  );
}


function App() {
  // PERSISTENT USER STATE
  const [pet, setPet] = useState(() => {
    const saved = localStorage.getItem("ruta_habitos_pet");
    return saved ? JSON.parse(saved) : {
      name: "Kira",
      title: "La Firme",
      species: "zorro",
      personality: "alegre",
      colorId: "amber",
      pose: "happy",
      level: 1,
      xp: 0,
      coins: 50,
      happiness: 80,
      energy: 90,
      equipped: { head: null, body: null, hand: null, aura: null, pet: null },
      inventory: ["crown_gold", "water_bottle"]
    };
  });

  const [habits, setHabits] = useState(() => {
    const saved = localStorage.getItem("ruta_habitos_list");
    return saved ? JSON.parse(saved) : [
      { id: "h1", type: "habit", title: "Beber Vaso de Agua 💧", positive: true, negative: false, streak: 3 },
      { id: "h2", type: "habit", title: "Comer Comida Chatarra 🍔", positive: false, negative: true, streak: 0 },
      { id: "d1", type: "daily", title: "30 Minutos de Caminata o Deporte", done: false, streak: 5 },
      { id: "d2", type: "daily", title: "Meditar 10 Minutos en Calma", done: false, streak: 2 }
    ];
  });

  const [activeTab, setActiveTab] = useState("tasks"); // 'tasks', 'wardrobe', 'shop', 'stats', 'reminders'
  const [toastMessage, setToastMessage] = useState(null);

  // New task inputs
  const [newTitle, setNewTitle] = useState("");
  const [newType, setNewType] = useState("habit");

  // Reminders state
  const [reminders, setReminders] = useState(() => {
    const saved = localStorage.getItem("ruta_habitos_reminders");
    return saved ? JSON.parse(saved) : [
      { id: 'r1', time: '08:00', title: '¡Hora de tomar agua y estirar!', active: true },
      { id: 'r2', time: '22:00', title: 'Momento de desconexión y lectura', active: true }
    ];
  });

  useEffect(() => {
    localStorage.setItem("ruta_habitos_pet", JSON.stringify(pet));
  }, [pet]);

  useEffect(() => {
    localStorage.setItem("ruta_habitos_list", JSON.stringify(habits));
  }, [habits]);

  useEffect(() => {
    localStorage.setItem("ruta_habitos_reminders", JSON.stringify(reminders));
  }, [reminders]);

  function triggerToast(msg) {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 2800);
  }

  function launchConfetti() {
    if (typeof confetti === "function") {
      confetti({
        particleCount: 60,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  }

  // Completing habits / gain XP and Coins
  const handleCompleteHabit = (id, isPositive = true) => {
    if (isPositive) {
      launchConfetti();
      const earnedXp = 15;
      const earnedCoins = 10;

      setPet(prev => {
        let newXp = prev.xp + earnedXp;
        let newLevel = prev.level;
        let xpNeeded = newLevel * 60;
        let newHappiness = Math.min(100, prev.happiness + 5);

        if (newXp >= xpNeeded) {
          newLevel += 1;
          newXp -= xpNeeded;
          triggerToast(`🎉 ¡${prev.name} SUBIÓ AL NIVEL ${newLevel}!`);
        } else {
          triggerToast(`+${earnedXp} XP · +${earnedCoins} Monedas 🪙`);
        }

        return {
          ...prev,
          level: newLevel,
          xp: newXp,
          coins: prev.coins + earnedCoins,
          happiness: newHappiness
        };
      });

      setHabits(prev => prev.map(h => {
        if (h.id === id) {
          return { ...h, streak: (h.streak || 0) + 1, done: h.type !== 'habit' ? true : h.done };
        }
        return h;
      }));
    } else {
      // Penalty for negative habit
      setPet(prev => ({
        ...prev,
        happiness: Math.max(10, prev.happiness - 10)
      }));
      triggerToast(`💔 La felicidad de ${pet.name} disminuyó.`);
    }
  };

  const handleAddCustomTask = () => {
    if (!newTitle.trim()) return;
    setHabits(prev => [
      ...prev,
      { id: "custom_" + Date.now(), type: newType, title: newTitle.trim(), positive: true, negative: false, streak: 0, done: false }
    ]);
    setNewTitle("");
    triggerToast("✨ Misión añadida con éxito");
  };

  const handleAddPresetChallenge = (preset) => {
    setHabits(prev => [
      ...prev,
      { id: "preset_" + Date.now(), type: preset.type, title: preset.title, positive: preset.positive ?? true, negative: preset.negative ?? false, streak: 0, done: false }
    ]);
    triggerToast(`🎯 Reto "${preset.title}" añadido`);
  };

  const handleBuyItem = (item) => {
    if (pet.coins < item.price) {
      triggerToast("❌ Monedas insuficientes");
      return;
    }
    setPet(prev => ({
      ...prev,
      coins: prev.coins - item.price,
      inventory: [...prev.inventory, item.id],
      equipped: { ...prev.equipped, [item.slot]: item.id }
    }));
    triggerToast(`🛍️ Compraste y equipaste ${item.name}`);
  };

  const handleToggleEquip = (item) => {
    setPet(prev => {
      const isEquipped = prev.equipped[item.slot] === item.id;
      return {
        ...prev,
        equipped: { ...prev.equipped, [item.slot]: isEquipped ? null : item.id }
      };
    });
  };

  return (
    <div className="max-w-5xl mx-auto px-3 py-6 space-y-6">
      
      {/* APP HEADER */}
      <header className="flex flex-col md:flex-row justify-between items-center bg-forest-800 text-parchment-100 p-4 rounded-2xl border-2 border-forest-600 card-3d gap-4">
        <div className="flex items-center gap-3">
          <span className="text-3xl">🐾</span>
          <div>
            <h1 className="font-fredoka text-2xl font-bold text-gold tracking-wide">Ruta de Hábitos</h1>
            <p className="text-xs text-sage-light font-semibold">Compañeros de Bienestar RPG</p>
          </div>
        </div>

        {/* Quick Stats Pill */}
        <div className="flex items-center gap-4 bg-forest-900/80 px-4 py-2 rounded-xl border border-forest-600 font-fredoka text-sm">
          <div className="flex items-center gap-1.5 text-gold">
            <span>🪙</span>
            <span className="font-bold">{pet.coins} Monedas</span>
          </div>
          <div className="w-px h-5 bg-forest-600" />
          <div className="flex items-center gap-1.5 text-terracotta-light">
            <span>❤️</span>
            <span className="font-bold">{pet.happiness}% Felicidad</span>
          </div>
        </div>
      </header>

      {/* ANIMAL COMPANION HERO CARD */}
      <div className="bg-parchment-200 border-3 border-forest-800 rounded-3xl p-6 card-3d flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden">
        
        {/* Left Side: Animal Visual & Interactive Canvas */}
        <div className="flex flex-col items-center">
          <FullBodyAnimal pet={pet} scale={1.1} />
          <div className="mt-2 text-center">
            <span className="inline-block bg-forest-800 text-gold font-fredoka font-bold text-xs px-3 py-1 rounded-full border border-forest-600">
              {SPECIES[pet.species]?.name} · {PERSONALITIES[pet.personality]?.name}
            </span>
          </div>
        </div>

        {/* Right Side: Companion Details & Vitals */}
        <div className="flex-1 w-full space-y-4">
          <div>
            <div className="flex items-center gap-2">
              <h2 className="font-fredoka text-2xl font-bold text-forest-900">{pet.name}</h2>
              <span className="text-sm font-bold text-terracotta bg-terracotta/10 px-2.5 py-0.5 rounded-lg border border-terracotta/30">
                "{pet.title}"
              </span>
            </div>
            <p className="text-xs text-forest-700 font-semibold mt-0.5">
              Nivel {pet.level} · {pet.xp} / {pet.level * 60} XP para siguiente nivel
            </p>
          </div>

          {/* Vitals Progress Bars */}
          <div className="space-y-2.5">
            {/* XP Bar */}
            <div>
              <div className="flex justify-between text-xs font-bold text-forest-800 mb-1">
                <span>⭐ Experiencia (XP)</span>
                <span>{Math.floor((pet.xp / (pet.level * 60)) * 100)}%</span>
              </div>
              <div className="w-full bg-parchment-400 h-3.5 rounded-full overflow-hidden border border-forest-800">
                <div 
                  className="bg-gold h-full transition-all duration-300"
                  style={{ width: `${Math.min(100, (pet.xp / (pet.level * 60)) * 100)}%` }}
                />
              </div>
            </div>

            {/* Happiness Bar */}
            <div>
              <div className="flex justify-between text-xs font-bold text-forest-800 mb-1">
                <span>❤️ Felicidad de la Mascota</span>
                <span>{pet.happiness}%</span>
              </div>
              <div className="w-full bg-parchment-400 h-3.5 rounded-full overflow-hidden border border-forest-800">
                <div 
                  className="bg-terracotta h-full transition-all duration-300"
                  style={{ width: `${pet.happiness}%` }}
                />
              </div>
            </div>
          </div>

          {/* Quick Action Pose Changer */}
          <div className="pt-2 flex items-center gap-2 overflow-x-auto">
            <span className="text-xs font-bold text-forest-800">Pose:</span>
            {Object.values(POSES).map(p => (
              <button
                key={p.id}
                onClick={() => setPet(prev => ({ ...prev, pose: p.id }))}
                className={`px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition border ${
                  pet.pose === p.id 
                    ? 'bg-forest-800 text-gold border-forest-900' 
                    : 'bg-parchment-100 text-forest-800 border-parchment-400 hover:bg-parchment-300'
                }`}
              >
                <span>{p.icon}</span>
                <span>{p.name}</span>
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* NAVIGATION TABS */}
      <nav className="flex gap-2 overflow-x-auto pb-1">
        {[
          { id: "tasks", label: "🎯 Misiones & Hábitos" },
          { id: "wardrobe", label: "🐾 Armario & Mascota" },
          { id: "shop", label: "🛍️ Tienda" },
          { id: "stats", label: "🏆 Logros" },
          { id: "reminders", label: "🔔 Recordatorios" }
        ].map(tab => (
          <button
            key={tab.id}
            onClick={() => setActiveTab(tab.id)}
            className={`px-4 py-2.5 rounded-xl font-fredoka font-bold text-sm whitespace-nowrap btn-3d transition ${
              activeTab === tab.id
                ? "bg-gold text-forest-900 btn-3d-gold"
                : "bg-forest-800 text-parchment-200 hover:bg-forest-700"
            }`}
          >
            {tab.label}
          </button>
        ))}
      </nav>


      {/* TAB 1: HABITS & TASKS */}
      {activeTab === "tasks" && (
        <div className="space-y-6">
          {/* Custom Task Creator */}
          <div className="bg-parchment-200 border-2 border-forest-800 p-4 rounded-2xl card-3d flex flex-col md:flex-row gap-3">
            <input
              type="text"
              value={newTitle}
              onChange={e => setNewTitle(e.target.value)}
              onKeyDown={e => e.key === "Enter" && handleAddCustomTask()}

            />
            <select
              value={newType}
              onChange={e => setNewType(e.target.value)}
              className="bg-parchment-100 border-2 border-parchment-400 rounded-xl px-3 py-2 text-sm text-forest-900 font-bold"
            >
              <option value="habit">🎯 Hábito (+ / -)</option>
              <option value="daily">📝 Rutina Diaria</option>
            </select>
            <button
              onClick={handleAddCustomTask}
              className="bg-forest-800 hover:bg-forest-700 text-parchment-100 font-fredoka font-bold px-6 py-2 rounded-xl btn-3d transition"

              + Añadir

          </div>

          {/* Active Tasks Columns */}
          <div className="grid md:grid-cols-2 gap-6">
            
            {/* HABITS COLUMN */}

                <span>🎯 Hábitos Continuos</span>

              {habits.filter(h => h.type === 'habit').map(h => (
                <div key={h.id} className="bg-parchment-100 border-2 border-forest-800 p-3.5 rounded-2xl card-3d flex items-center justify-between gap-3">
                  <div>
                    <div className="font-bold text-sm text-forest-900">{h.title}</div>
                    <div className="text-xs font-bold text-gold-hover mt-0.5">🔥 Racha: {h.streak || 0} días</div>
                  </div>
                  <div className="flex gap-1.5">
                    {h.positive && (
                      <button
                        onClick={() => handleCompleteHabit(h.id, true)}
                        className="w-9 h-9 rounded-xl bg-sage hover:bg-sage-dark text-white font-black text-lg btn-3d flex items-center justify-center"
                      >
                        +
                      </button>
                    )}
                    {h.negative && (
                      <button
                        onClick={() => handleCompleteHabit(h.id, false)}
                        className="w-9 h-9 rounded-xl bg-terracotta hover:bg-terracotta-dark text-white font-black text-lg btn-3d-terracotta flex items-center justify-center"

                        -
                      </button>

                </div>

            {/* DAILIES COLUMN */}
            <div className="space-y-3">
              <h3 className="font-fredoka font-bold text-forest-800 text-lg flex items-center gap-2">
                <span>📝 Rutinas de Hoy</span>
              </h3>
              {habits.filter(h => h.type === 'daily').map(h => (
                <div key={h.id} className={`bg-parchment-100 border-2 border-forest-800 p-3.5 rounded-2xl card-3d flex items-center justify-between gap-3 ${h.done ? 'opacity-60 bg-parchment-300' : ''}`}>

                    <button

                      <div className={`font-bold text-sm ${h.done ? 'line-through text-forest-600' : 'text-forest-900'}`}>{h.title}</div>

          </div>

          <div className="space-y-3 pt-4 border-t-2 border-forest-800/20">
            <h3 className="font-fredoka font-bold text-forest-800 text-lg">

            </h3>

                    <span className="text-[10px] font-bold text-forest-700 uppercase">{preset.category}</span>

                </div>

            </h3>

                />
              </div>
              <div>
                <label className="text-xs font-bold text-forest-800">Mote / Título</label>
                <input
                  type="text"
                  value={pet.title}

                  <div key={item.id} className={`bg-parchment-100 border-2 border-forest-800 p-3 rounded-2xl flex flex-col justify-between ${isEquipped ? 'ring-2 ring-gold bg-parchment-200' : ''}`}>
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">{item.icon}</span>
                      <div>
                        <div className="font-bold text-xs text-forest-900">{item.name}</div>
                        <div className="text-[10px] text-forest-600 font-semibold">{item.desc}</div>
                      </div>
                    </div>
                    <button
                      onClick={() => handleToggleEquip(item)}
                      className={`mt-2 w-full py-1 rounded-lg font-fredoka font-bold text-xs transition ${
                        isEquipped ? 'bg-terracotta text-white' : 'bg-gold text-forest-900'
                      }`}
                    >
                      {isEquipped ? 'Desequipar' : 'Equipar'}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* TAB 3: SHOP */}
      {activeTab === "shop" && (
        <div className="space-y-4">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {EQUIPMENT_CATALOGUE.map(item => {
              const isOwned = pet.inventory.includes(item.id);
              return (
                <div key={item.id} className="bg-parchment-100 border-2 border-forest-800 p-4 rounded-2xl card-3d flex flex-col items-center text-center justify-between">
                  <div className="text-4xl my-2">{item.icon}</div>
                  <div className="font-bold text-sm text-forest-900">{item.name}</div>
                  <div className="text-xs text-forest-600 font-medium my-1">{item.desc}</div>
                  
                  {isOwned ? (
                    <span className="mt-2 text-xs font-bold text-sage bg-sage/20 px-3 py-1 rounded-full border border-sage">
                      ✓ Poseído
                    </span>
                  ) : (
                    <button
                      onClick={() => handleBuyItem(item)}
                      className="mt-2 w-full bg-gold hover:bg-gold-hover text-forest-900 font-fredoka font-bold text-xs py-1.5 rounded-xl btn-3d-gold transition"
                    >
                      Comprar 🪙 {item.price}
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* TAB 4: ACHIEVEMENTS & STATS */}
      {activeTab === "stats" && (
        <div className="grid md:grid-cols-2 gap-6">
          <div className="bg-parchment-200 border-2 border-forest-800 p-5 rounded-2xl card-3d space-y-3">
            <h3 className="font-fredoka font-bold text-forest-900 text-lg">🏅 Pabellón de Medallas</h3>
            <div className="space-y-2">
              {[
                { title: "Pabellón del Agua", desc: "Completaste 5 hábitos de hidratación", unlocked: true, icon: "💧" },
                { title: "Racha Incombustible", desc: "Mantuviste una racha de 3 días", unlocked: true, icon: "🔥" },
                { title: "Coleccionista Moda", desc: "Posees más de 2 objetos en el armario", unlocked: pet.inventory.length >= 2, icon: "👑" },
                { title: "Maestro del Bienestar", desc: "Alcanza el Nivel 5 con tu mascota", unlocked: pet.level >= 5, icon: "🌟" }
              ].map((m, i) => (
                <div key={i} className={`p-3 rounded-xl border-2 flex items-center gap-3 ${m.unlocked ? 'bg-parchment-100 border-forest-800' : 'bg-parchment-300/50 border-parchment-400 opacity-50'}`}>
                  <span className="text-2xl">{m.icon}</span>
                  <div>
                    <div className="font-bold text-xs text-forest-900">{m.title}</div>
                    <div className="text-[10px] text-forest-700">{m.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-parchment-200 border-2 border-forest-800 p-5 rounded-2xl card-3d space-y-3">
            <h3 className="font-fredoka font-bold text-forest-900 text-lg">📊 Constancia Semanal</h3>
            <div className="flex items-end justify-between h-40 pt-6 px-2">
              {['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map((d, i) => (
                <div key={d} className="flex flex-col items-center gap-2 flex-1">
                  <div className="w-6 bg-forest-800 rounded-t-lg transition-all" style={{ height: `${(i + 3) * 12}px` }} />
                  <span className="text-[10px] font-bold text-forest-800">{d}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* TAB 5: REMINDERS */}
      {activeTab === "reminders" && (
        <div className="bg-parchment-200 border-2 border-forest-800 p-5 rounded-2xl card-3d space-y-4">
          <h3 className="font-fredoka font-bold text-forest-900 text-lg">🔔 Recordatorios Activos</h3>
          <div className="space-y-3">
            {reminders.map(r => (
              <div key={r.id} className="bg-parchment-100 border-2 border-forest-800 p-3 rounded-xl flex items-center justify-between">
                <div>
                  <span className="font-fredoka font-bold text-gold text-sm bg-forest-800 px-2.5 py-0.5 rounded-md">{r.time}</span>
                  <p className="font-bold text-xs text-forest-900 mt-1">{r.title}</p>
                </div>
                <button
                  onClick={() => setReminders(prev => prev.map(item => item.id === r.id ? { ...item, active: !item.active } : item))}
                  className={`px-3 py-1 rounded-lg text-xs font-bold ${r.active ? 'bg-sage text-white' : 'bg-parchment-400 text-forest-800'}`}
                >
                  {r.active ? 'Activo' : 'Inactivo'}
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* TOAST POPUP NOTIFICATION */}
      {toastMessage && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-forest-900 text-gold px-6 py-3 rounded-2xl font-fredoka font-bold border-2 border-gold shadow-2xl z-50 animate-bounce">
          {toastMessage}
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
